[tool.poetry]
name = "savefood-backend"
version = "1.0.0"
description = "SaveFood DZ - Backend API for the three-sided food waste reduction marketplace"
authors = ["SaveFood DZ Team"]
readme = "README.md"

[tool.poetry.dependencies]
python = "^3.11"
Django = "^5.0"
djangorestframework = "^3.14"
psycopg2-binary = "^2.9"
django-cors-headers = "^4.3"
djangorestframework-simplejwt = "^5.3"
django-filter = "^23.5"
celery = {extras = ["redis"], version = "^5.3"}
redis = "^5.0"
django-redis = "^5.4"
boto3 = "^1.34"
Pillow = "^10.2"
python-magic = "^0.4"
django-environ = "^0.11"
whitenoise = "^6.6"
dj-database-url = "^2.1"
psycopg = {extras = ["binary"], version = "^3.1"}
drf-spectacular = "^0.27"
django-storages = "^1.14"
sentry-sdk = {extras = ["django"], version = "^1.40"}
python-json-logger = "^2.0"
gunicorn = "^21.2"
django-celery-beat = "^2.6"
flower = "^2.0"

[tool.poetry.group.dev.dependencies]
django-debug-toolbar = "^4.3"
django-extensions = "^3.2"
factory-boy = "^3.3"
faker = "^24.0"
ipython = "^8.22"
black = "^24.2"
isort = "^5.13"
flake8 = "^7.0"
pylint = "^3.1"
pylint-django = "^2.5"
mypy = "^1.9"
django-stubs = "^4.2"
djangorestframework-stubs = "^3.14"

[tool.poetry.group.test.dependencies]
pytest = "^8.1"
pytest-django = "^4.8"
pytest-cov = "^5.0"
pytest-xdist = "^3.5"
pytest-mock = "^3.12"
model-bakery = "^1.18"
responses = "^0.25"

[tool.black]
line-length = 100
target-version = ["py311"]
exclude = '''
/(
    \.git
  | \.mypy_cache
  | \.venv
  | migrations
)/
'''

[tool.isort]
profile = "black"
line_length = 100
skip = ["migrations", ".venv"]
known_django = ["django", "rest_framework"]
known_first_party = ["apps", "config"]
sections = ["FUTURE", "STDLIB", "THIRDPARTY", "DJANGO", "FIRSTPARTY", "LOCALFOLDER"]

[tool.mypy]
python_version = "3.11"
plugins = ["mypy_django_plugin.main", "mypy_drf_plugin.main"]
ignore_missing_imports = true
strict = false
exclude = ["migrations/"]

[tool.django-stubs]
django_settings_module = "config.settings.development"

[tool.pylint.master]
load-plugins = ["pylint_django"]
django-settings-module = "config.settings.development"

[tool.pylint.format]
max-line-length = 100

[tool.pylint."messages control"]
disable = ["C0111", "R0903", "W0212"]

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"
