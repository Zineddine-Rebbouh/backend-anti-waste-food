version: "3.9"

# =============================================
# SaveFood DZ - Local Development Environment
# =============================================

services:

  # ── PostgreSQL with PostGIS ──────────────────
  db:
    image: postgis/postgis:15-3.3
    container_name: savefood_db
    restart: unless-stopped
    environment:
      POSTGRES_DB: savefood_db
      POSTGRES_USER: savefood_user
      POSTGRES_PASSWORD: savefood_pass
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U savefood_user -d savefood_db"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ── Redis ────────────────────────────────────
  redis:
    image: redis:7-alpine
    container_name: savefood_redis
    restart: unless-stopped
    command: redis-server --appendonly yes --maxmemory 256mb --maxmemory-policy allkeys-lru
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ── Django Application ───────────────────────
  web:
    build:
      context: .
      dockerfile: Dockerfile
      target: development
    container_name: savefood_web
    restart: unless-stopped
    command: >
      sh -c "python manage.py migrate &&
             python manage.py runserver 0.0.0.0:8080"
    environment:
      DJANGO_SETTINGS_MODULE: config.settings.development
      DATABASE_URL: postgresql://savefood_user:savefood_pass@db:5432/savefood_db
      REDIS_URL: redis://redis:6379/0
      CELERY_BROKER_URL: redis://redis:6379/0
      CELERY_RESULT_BACKEND: redis://redis:6379/1
      AWS_S3_ENDPOINT_URL: http://minio:9000
    env_file:
      - .env
    ports:
      - "8080:8080"
    volumes:
      - .:/app
      - media_data:/app/media
      - static_data:/app/staticfiles
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8080/health/')"]
      interval: 30s
      timeout: 10s
      start_period: 40s
      retries: 3

  # ── Celery Worker ────────────────────────────
  celery_worker:
    build:
      context: .
      dockerfile: Dockerfile
      target: development
    container_name: savefood_celery_worker
    restart: unless-stopped
    command: celery -A config worker -l INFO -c 4 -Q default,high_priority,low_priority
    environment:
      DJANGO_SETTINGS_MODULE: config.settings.development
      DATABASE_URL: postgresql://savefood_user:savefood_pass@db:5432/savefood_db
      REDIS_URL: redis://redis:6379/0
      CELERY_BROKER_URL: redis://redis:6379/0
      CELERY_RESULT_BACKEND: redis://redis:6379/1
    env_file:
      - .env
    volumes:
      - .:/app
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy

  # ── Celery Beat (Scheduler) ──────────────────
  celery_beat:
    build:
      context: .
      dockerfile: Dockerfile
      target: development
    container_name: savefood_celery_beat
    restart: unless-stopped
    command: celery -A config beat -l INFO --scheduler django_celery_beat.schedulers:DatabaseScheduler
    environment:
      DJANGO_SETTINGS_MODULE: config.settings.development
      DATABASE_URL: postgresql://savefood_user:savefood_pass@db:5432/savefood_db
      REDIS_URL: redis://redis:6379/0
      CELERY_BROKER_URL: redis://redis:6379/0
      CELERY_RESULT_BACKEND: redis://redis:6379/1
    env_file:
      - .env
    volumes:
      - .:/app
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy

  # ── Flower (Celery Monitoring) ───────────────
  flower:
    build:
      context: .
      dockerfile: Dockerfile
      target: development
    container_name: savefood_flower
    restart: unless-stopped
    command: celery -A config flower --port=5555 --broker=redis://redis:6379/0
    environment:
      DJANGO_SETTINGS_MODULE: config.settings.development
      CELERY_BROKER_URL: redis://redis:6379/0
    env_file:
      - .env
    ports:
      - "5555:5555"
    depends_on:
      - redis
      - celery_worker

  # ── MinIO (S3-Compatible Storage) ────────────
  minio:
    image: minio/minio:latest
    container_name: savefood_minio
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - minio_data:/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 30s
      timeout: 10s
      retries: 3

volumes:
  postgres_data:
  redis_data:
  minio_data:
  media_data:
  static_data:

networks:
  default:
    name: savefood_network
